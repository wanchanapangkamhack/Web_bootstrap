<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link href="css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="img.css">
    <link rel="stylesheet" href="background.css">
</head>
<body class="bg-secondary">
    <div class="container  ">
<!-- Menu-->
     <div id="menu-container"></div>
    <!--background -->
    <div class="animated-bg">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>

        <div class="container"></div>
</div>
        <div class="row  ">
            <div class="col-md-6 mx-auto mt-5 bg-light   rounded">
                <div class="h3 text-center	text-primary mt-3 ">login</div>
                <div class="mb-3 mt-4 ">
                    <label class="form-label">Firstname - Lastname</label>
                    <input type="text" class="form-control" id="firstname-lastname" placeholder="firstname - lastname">
                </div>
                <div class="mb-3 mt-4 ">
                    <label class="form-label">password</label>
                    <input type="password" class="form-control" id="password" placeholder="password">
                </div>
                <div class="mb-3 mt-4 ">
                    <label class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com">
                </div>
                <div class="mb-3">
                    <label class="form-label">Example textarea</label>
                    <textarea class="form-control" id="textDetail" rows="3"></textarea>
                </div>
                <div class="text-center mb-4">
                    <input type="submit" id="submit" class="btn btn-primary" value="Submit">
                    <a href="register.html" class="btn btn-secondary">#</a>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
    </script>
</body>
</html>
