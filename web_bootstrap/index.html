<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <link href="css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="img.css">
    <link rel="stylesheet" href="background.css">
</head>
<body> 
    <!-- Menu-->
    <div id="menu-container"></div>

    <!--background -->
    <div class="animated-bg">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>

        <div class="container"></div>

    <div class="container">
        <!-- Content here -->
        <div class="text-center mb-4">
        <h3 class="alert alert-danger mt-4">หน้าหลัก</h3>        
        <div class="alert alert-primary text-end" role="alert">
            wanchana pangkamhack
        </div>
        <div class="text-center mb-6">
            <a class="btn btn-info" href="http://www.google.com/">Google</a>
        </div>             
      </div>
      <br>

        <!-- แบ่งคอลัมด้วย Grid system -->
        <div class="container text-center">
            <div class="row">
                <div class="col-sm-4 bg-primary-subtle p-3 rounded"> 
                    <img src="ปลาทองimages.jpg" class="img-fluid same-img shadow-sm" alt="ปลาทอง1">
                    <p class="mt-2 fw-bold">ปลาทอง 1</p>
                </div>
                <div class="col-sm-4 bg-success-subtle p-3 rounded">
                    <img src="ปลาทองv1images.jpg" class="img-fluid same-img shadow-sm" alt="ปลาทอง2">
                    <p class="mt-2 fw-bold">ปลาทอง 2</p>
                </div>
              <div class="col-sm-4   bg-info-subtle">
                <h4 class="mt-4">Register</h3>
                <form class="text-start">
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Firstname</label>
                        <input type="firstname" class="form-control" id="firstname" required placeholder="input firstname">
                      </div>
                      <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Lastname</label>
                        <input type="lastname" class="form-control" id="lastname" required placeholder="input lastname">
                      </div>
                    <div class="mb-3">
                      <label for="exampleInputEmail1" class="form-label">Telephone</label>
                      <input type="number" class="form-control" id="phone" required placeholder="XXX-XXX-XXXX">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">province</label>
                        <select class="form-select" id="province">
                            <option selected>เลือกจังหวัด</option>
                            <option value="1">ชลบุรี</option>
                            <option value="2">ระยอง</option>
                            <option value="3">เชียงใหม่</option>
                          </select>
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="e-mail" required placeholder="@gmail.com">
                      </div>
                    <div class="mb-3">
                      <label for="exampleInputPassword1" class="form-label">Password</label>
                      <input type="password" class="form-control" id="pw" required placeholder="123456789">
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary">Submit</button>
                        <button type="reset" class="btn btn-info">Cancel</button>
                    </div>
                  </form>
              </div>
            </div>
          </div>

    </div>
</body>
</html>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/menu.js"></script>
