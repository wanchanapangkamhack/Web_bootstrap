<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produact</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="img.css">
    <link rel="stylesheet" href="background.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <!-- Menu-->
    <div id="menu-container"></div>

    <!-- เนื้อหา -->
    <div class="container">
        <h3 class="product-title text-center mb-4 mt-5">
            แสดงข้อมูลสินค้า

        <div class="row g-4">

            <!-- สินค้า 1 -->
            <div class="col-sm-6 col-md-3">
                <div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
        
                    <img src="img/1.jpg"
                         alt="Image 1"
                         class="img-fluid same-img">
        
                    <div class="card-body text-center">
                        <h4 class="card-title mt-2">สินค้า 1</h4>
                        <p class="text-muted">ราคา 10,000 บาท</p>
        
                        <a href="#" class="btn btn-outline-dark rounded-pill px-4"> <span class="bi bi-shop"></span>
                            Add+
                        </a>
                    </div>
        
                </div>
            </div>
        
            <!-- สินค้า 2 -->
            <div class="col-sm-6 col-md-3">
                <div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
        
                    <img src="img/2.jpg"
                         alt="Image 2"
                         class="img-fluid same-img">
        
                    <div class="card-body text-center">
                        <h4 class="card-title mt-2">สินค้า 2</h4>
                        <p class="text-muted">ราคา 5,000 บาท</p>
        
                        <a href="#" class="btn btn-outline-dark rounded-pill px-4"> <span class="bi bi-shop"></span>
                            Add+
                        </a>
                    </div>
        
                </div>
            </div>
        
            <!-- สินค้า 3 -->
            <div class="col-sm-6 col-md-3">
                <div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
        
                    <img src="img/3.jpg"
                         alt="Image 3"
                         class="img-fluid same-img">
        
                    <div class="card-body text-center">
                        <h4 class="card-title mt-2">สินค้า 3</h4>
                        <p class="text-muted">ราคา 100 บาท</p>
        
                        <a href="#" class="btn btn-outline-dark rounded-pill px-4"> <span class="bi bi-shop"></span>
                            Add+
                        </a>
                    </div>
        
                </div>
            </div>
        
            <!-- สินค้า 4 -->
            <div class="col-sm-6 col-md-3">
                <div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
        
                    <img src="img/4.jpg"
                         alt="Image 4"
                         class="img-fluid same-img">
        
                    <div class="card-body text-center">
                        <h4 class="card-title mt-2">สินค้า 4</h4>
                        <p class="text-muted">ราคา 2,000 บาท</p>
        
                        <a href="#" class="btn btn-outline-dark rounded-pill px-4"> <span class="bi bi-shop"></span>
                            Add+
                        </a>
                    </div>
        
                </div>
            </div>
        
        </div>
        
    </div>

</html>

<script src="js/bootstrap.bundle.min.js"></script>
